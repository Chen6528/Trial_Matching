[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trial-matching-backend"
version = "0.1.0"
description = "Clinical trial matching API — CT.gov retrieval + pgvector shortlist + Claude per-criterion eligibility reasoning"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "openai>=1.40",
    "supabase>=2.7",
    "httpx>=0.27",
    "curl_cffi>=0.7",  # CT.gov is behind Akamai bot detection; impersonate a browser TLS fingerprint
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
