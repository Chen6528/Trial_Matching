name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (editable + dev deps)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # Credential-free: scoring + the /api/match route test mock all provider calls.
      # eval/run_eval.py is intentionally NOT run here — it needs ANTHROPIC_API_KEY and costs money.
      - name: Test
        run: pytest

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      # next build needs no backend; NEXT_PUBLIC_API_URL falls back to localhost at runtime.
      - name: Build
        run: npm run build
